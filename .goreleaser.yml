version: 2

project_name: terraform-provider-forward

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod tidy

dist: dist

builds:
  - id: provider
    main: .
    binary: terraform-provider-forward
    ldflags:
      - -s -w -X main.version={{.Version}}
    flags:
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: provider-archive
    builds:
      - provider
    format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

# The Terraform Registry verifies every release against a GPG key registered
# with the namespace: the checksum file must be detach-signed by it, and the
# registry manifest must ship beside the archives under this exact name.
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  prerelease: auto
  draft: false
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  use: github
  sort: asc
